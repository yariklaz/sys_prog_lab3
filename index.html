<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AST Viewer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; }
        .node circle { fill: #fff; stroke: #4682b4; stroke-width: 3px; }
        .node text { font: 14px sans-serif; font-weight: bold; }
        .link { fill: none; stroke: #ccc; stroke-width: 2px; }
    </style>
</head>
<body>
    <script>
        d3.json("ast.json").then(function(data) {
            const width = 1000;
            const height = 600;
            
            const svg = d3.select("body").append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", "translate(40,40)");

            const tree = d3.tree().size([width - 80, height - 100]);
            const root = d3.hierarchy(data);
            tree(root);

            svg.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical()
                    .x(d => d.x)
                    .y(d => d.y));

            const node = svg.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            node.append("circle").attr("r", 12);

            node.append("text")
                .attr("dy", 4)
                .attr("y", d => d.children ? -25 : 25)
                .style("text-anchor", "middle")
                .text(d => d.data.name);
        });
    </script>
</body>
</html>
